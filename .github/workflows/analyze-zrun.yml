name: Analyze ZRun

# Decompile ZRun (com.zijun.zrun) and dump the REAL Jieli RCSP protocol classes
# (framing/parser, external-flash + watch-face file transfer) that the N88 badge
# uses. Interop reverse-engineering only; nothing decompiled is committed.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-zrun.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Download + unpack + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLnppanVuLnpydW5fMjAyNjA3MTQxNl9hYzY3NDIwMA?_p=Y29tLnppanVuLnpydW4%3D&download_id=1876509444531939&filename=ZRun_2.4.0_APKPure.xapk&full_size=89344935&is_hot=false&k=497d3ade37290e196b5c235b54770e3e6a641d28&package_name=com.zijun.zrun&source=web&token=1784773160-2328deaf1c-0-8c7826852cea2dd476bd414d75bc1ec5'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o zrun.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../zrun.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'zijun|zrun|base' | head -1 || ls xapk/*.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
          echo "java files: $(find jadx-out -name '*.java' | wc -l)"

      - name: TREE jl_rcsp + jl_bt_ota (with sizes)
        run: |
          set +e
          echo "===== jl_rcsp tree ====="
          find jadx-out/sources/com/jieli/jl_rcsp -name '*.java' -printf '%s\t%p\n' 2>/dev/null | sort -k2
          echo "===== watch / dial / bigfile / externalflash files ====="
          grep -rlniE "WatchFace|CustomWatch|BigFile|FatFile|LargeFile|ExternalFlash|FileTransfer|BumpFile|blockSize|packetSize" jadx-out/sources/com/jieli/jl_rcsp --include=*.java 2>/dev/null | sort -u | head -60

      - name: DUMP RCSP wire frame packer (the class that computes CRC16)
        run: |
          set +e
          for f in $(grep -rliE "CryptoUtil.CRC16|\.CRC16\(|crc16" jadx-out/sources/com/jieli/jl_rcsp --include=*.java 2>/dev/null | grep -iE "protocol|parse|packet|frame|handler|impl|util" | grep -viE "CryptoUtil.java" | sort -u | head -4); do
            echo "@@@@@ $f @@@@@"; cat "$f"
          done

      - name: DUMP flash param byte layouts
        run: |
          set +e
          for n in ExternalFlashIOCtrlParam CreateFlashFileParam WriteDataParam QueryWriteResultParam; do
            f=$(find jadx-out/sources/com/jieli/jl_rcsp -name "$n.java" 2>/dev/null | head -1)
            [ -n "$f" ] && { echo "@@@@@ $f @@@@@"; cat "$f"; }
          done
          for n in EnableCustomDialBgParam SetUsingDialParam GetFlashFreeSpaceParam; do
            f=$(find jadx-out/sources/com/jieli/jl_rcsp -name "$n.java" 2>/dev/null | head -1)
            [ -n "$f" ] && { echo "@@@@@ $f @@@@@"; cat "$f"; }
          done

      - name: DUMP image → custom-bg bytes conversion (app side)
        run: |
          set +e
          echo "===== classes that convert a bitmap for external-flash write ====="
          grep -rlniE "buildExternalFlashWriteDataCmd|EnableCustomDialBg|RGB_565|copyPixelsToBuffer|customDialBg|CustomBg|dialBg" jadx-out/sources --include=*.java 2>/dev/null \
            | grep -viE "com/jieli/jl_rcsp/model|androidx|/google/" | sort -u | head -8 | while read f; do
              echo "@@@@@ $f @@@@@"; sed -n '1,220p' "$f"
            done
