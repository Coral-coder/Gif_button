name: Analyze BeamBox

# One-shot: download the BeamBox XAPK (com.guangshen.beambox) — the app that
# ships with the 01F0/01F1/01F2 badge — decompile it, and extract its BLE
# protocol so we can port a BeamBox adapter. Interop reverse-engineering only;
# findings are purged after porting.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-beambox.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Download XAPK
        run: |
          set -e
          URL='https://data.winudf.com/XAPK/Y29tLmd1YW5nc2hlbi5iZWFtYm94XzIxX2UxMzMyODhh?_p=Y29tLmd1YW5nc2hlbi5iZWFtYm94&download_id=1876509444531939&filename=beambox_1.0.13_APKPure.xapk&full_size=65376244&is_hot=false&k=5622560b182fbbda46797f87ed86d9606a642b7a&package_name=com.guangshen.beambox&source=web&token=1784776826-ee738f626c-0-9481c5e1902775b763e60c30c1a14a82'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o bb.xapk "$URL"
          echo "size: $(stat -c%s bb.xapk 2>/dev/null || echo 0)"; file bb.xapk

      - name: Unpack + locate app logic
        run: |
          set -e
          mkdir -p xapk && (cd xapk && unzip -oq ../bb.xapk || true)
          APK=$(ls xapk/*.apk 2>/dev/null | grep -iE 'guangshen|beambox|base' | head -1 || ls xapk/*.apk 2>/dev/null | head -1)
          echo "APK=$APK"; echo "APK=$APK" >> "$GITHUB_ENV"
          mkdir -p apk && (cd apk && unzip -oq "../$APK" || true)
          echo "== apk top =="; ls apk | head -40
          echo "== assets (hybrid JS?) =="; find apk/assets -maxdepth 4 -name '*.js' 2>/dev/null | head -30
          echo "== dex/so =="; ls apk/*.dex 2>/dev/null; ls apk/lib/*/ 2>/dev/null | head

      - name: Extract (JS path — uni-app/hybrid)
        run: |
          set +e
          mkdir -p reverse-engineering/beambox-src
          OUT=reverse-engineering/beambox-findings.md
          echo "# BeamBox (com.guangshen.beambox) protocol extraction" > "$OUT"
          JS=$(find apk/assets -name 'app-service.js' 2>/dev/null | head -1)
          if [ -n "$JS" ]; then
            echo "HYBRID uni-app JS found: $JS" >> "$OUT"
            cp "$JS" reverse-engineering/beambox-src/app-service.js
            for f in $(find apk/assets -name '*.js' 2>/dev/null); do
              if grep -qiE "BLE|Bluetooth|writeBLE|01f[0-2]|characteristic|Protocol" "$f"; then
                cp "$f" "reverse-engineering/beambox-src/$(basename $f)"
              fi
            done
            echo -e "\n## BLE symbols in app-service.js" >> "$OUT"
            grep -oiE "0000[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|01f[0-2]|writeBLECharacteristicValue|BluetoothProtocol|createAlbum|packData|packBinary|HEAD_|checksum|fragment|IMB|jpeg" "$JS" | sort | uniq -c | sort -rn | head -60 >> "$OUT"
          else
            echo "No hybrid JS; native app." >> "$OUT"
          fi

      - name: Extract (native path — jadx)
        run: |
          set +e
          OUT=reverse-engineering/beambox-findings.md
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx -d jadx-out --no-res "$APK" 2>/dev/null
          echo "java files: $(find jadx-out -name '*.java' 2>/dev/null | wc -l)" >> "$OUT"
          echo -e "\n## BLE UUID hits (java)" >> "$OUT"
          grep -rniE "000001f[0-2]|01F[0-2]|UUID_SERVICE|UUID_WRITE|UUID_NOTIF|fromString\(" jadx-out --include=*.java 2>/dev/null | grep -iE "uuid|01f|service|charact" | sort -u | head -60 >> "$OUT"
          echo -e "\n## protocol/framing/crypto files" >> "$OUT"
          grep -rliE "01f[0-2]|writeCharacteristic|BluetoothGatt|Protocol|checksum|cipher|jieli|IMB|jpeg|albumn?|frame|packData" jadx-out --include=*.java 2>/dev/null | grep -iE "blue|ble|protocol|badge|device|jieli|album|frame|cmd|packet" | sort -u | head -40 >> "$OUT"
          # copy the most relevant classes
          for f in $(grep -rliE "000001f|writeCharacteristic.*01f|BleProtocol|Protocol.*Ble|packData|createAlbum|IMB|badge|Badge" jadx-out --include=*.java 2>/dev/null | head -40); do
            base=$(echo "$f" | sed 's#[/.]#_#g'); cp "$f" "reverse-engineering/beambox-src/$base" 2>/dev/null
          done
          echo -e "\n## strings in native libs" >> "$OUT"
          for so in apk/lib/*/*.so; do echo "### $so" >> "$OUT"; strings "$so" 2>/dev/null | grep -iE "000001f|jieli|cipher|handshake|01f[0-2]" | sort -u | head -15 >> "$OUT"; done
          echo -e "\n## copied files:" >> "$OUT"; ls reverse-engineering/beambox-src 2>/dev/null | head -60 >> "$OUT"
          echo "-- preview --"; head -60 "$OUT"

      - name: Commit findings
        if: always()
        run: |
          git config user.name "beambox-analyzer"
          git config user.email "actions@users.noreply.github.com"
          git add reverse-engineering/ 2>/dev/null || true
          git commit -m "CI: extract BeamBox (01F0) BLE protocol findings" || echo "nothing to commit"
          git push || echo "push failed"
