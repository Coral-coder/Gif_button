name: Analyze BeamBox

# Decompile the BeamBox XAPK (com.guangshen.beambox) and dump ONLY the small
# BLE-protocol packages into the log, so the output fits and can be read whole.
# Interop reverse-engineering only; nothing decompiled is committed.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-beambox.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Download + unpack + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLmd1YW5nc2hlbi5iZWFtYm94XzIxX2UxMzMyODhh?_p=Y29tLmd1YW5nc2hlbi5iZWFtYm94&download_id=1876509444531939&filename=beambox_1.0.13_APKPure.xapk&full_size=65376244&is_hot=false&k=5622560b182fbbda46797f87ed86d9606a642b7a&package_name=com.guangshen.beambox&source=web&token=1784776826-ee738f626c-0-9481c5e1902775b763e60c30c1a14a82'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o bb.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../bb.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'guangshen|beambox|base' | head -1 || ls xapk/*.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
          echo "java files: $(find jadx-out -name '*.java' | wc -l)"

      - name: DUMP manager/j.java (BleManager — split builder t())
        run: |
          set +e
          echo "@@@@@ j.java @@@@@"; cat jadx-out/sources/com/example/nn20/manager/j.java

      - name: DUMP activate/version/connect senders (grep)
        run: |
          set +e
          grep -rn "TYPE_ACTIVATE_QUERY\|TYPE_GET_VERSION\|ActivateQueryBean\|GetVersionBean\|setCharacteristicNotification\|GetPacketSucc\|writeType" jadx-out/sources/com/example/nn20 2>/dev/null | head -60
