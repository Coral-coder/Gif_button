name: Analyze Qix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-qix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLnppanVuLnpydW5fMjAyNjA3MTQxNl9hYzY3NDIwMA?_p=Y29tLnppanVuLnpydW4%3D&download_id=1876509444531939&filename=ZRun_2.4.0_APKPure.xapk&full_size=89344935&is_hot=false&k=497d3ade37290e196b5c235b54770e3e6a641d28&package_name=com.zijun.zrun&source=web&token=1784773160-2328deaf1c-0-8c7826852cea2dd476bd414d75bc1ec5'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o z.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../z.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'zijun|zrun|base' | head -1 || ls xapk/*.apk | head -1)
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
      - name: DUMP send framing (BLEBluetooth) + CommandCode
        run: |
          set +e
          for p in $(find jadx-out/sources/com/qix/library -name 'BLEBluetooth.java' -o -name 'CommandCode.java' -o -name 'SendCommand*.java' -o -name 'Command.java' 2>/dev/null | sort -u); do
            echo "@@@@@ $p @@@@@"; cat "$p"
          done
      - name: DUMP picture / custom-theme / dial / bootanim upload command
        run: |
          set +e
          echo "===== files that build a picture/theme/dial send ====="
          grep -rlniE "CustomTheme|customTheme|updateTheme|sendTheme|BootAnimation|watchDial|customDial|picture|RGB|bmp|thumbnail|565" jadx-out/sources/com/qix/library --include=*.java 2>/dev/null | grep -viE "Return|Parse|Receive" | sort -u | head -20
          echo "===== dump the top command-send classes touching theme/picture ====="
          for f in $(grep -rliE "CustomTheme|updateCustomTheme|sendCustomTheme|watchTheme|dialData|565|RGB_565|Bitmap" jadx-out/sources/com/qix/library --include=*.java 2>/dev/null | grep -viE "/bean/|Return|ReceiveCommandParse" | sort -u | head -6); do
            echo "@@@@@ $f @@@@@"; sed -n '1,300p' "$f"
          done
