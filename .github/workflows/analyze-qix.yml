name: Analyze Qix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-qix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLnppanVuLnpydW5fMjAyNjA3MTQxNl9hYzY3NDIwMA?_p=Y29tLnppanVuLnpydW4%3D&download_id=1876509444531939&filename=ZRun_2.4.0_APKPure.xapk&full_size=89344935&is_hot=false&k=497d3ade37290e196b5c235b54770e3e6a641d28&package_name=com.zijun.zrun&source=web&token=1784773160-2328deaf1c-0-8c7826852cea2dd476bd414d75bc1ec5'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o z.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../z.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'zijun|zrun|base' | head -1 || ls xapk/*.apk | head -1)
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
      - name: TypeConversion + ImageCacheUtils byte order (short/int/bytes2Int)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*TypeConversion.java' | head -1)
          echo "@@@@@ $f @@@@@"
          for m in shortToByteArray bytes2Int bytes2Short intToBytes bytes2Chars; do
            echo "--- $m ---"
            [ -f "$f" ] && sed -n "/$m/,/^    }/p" "$f" | head -18
          done
          g=$(find jadx-out/sources -path '*qix*ImageCacheUtils.java' | head -1)
          echo "@@@@@ $g (shortToByteArray if local) @@@@@"
          [ -f "$g" ] && sed -n '/shortToByteArray/,/^    }/p' "$g" | head -18
      - name: Badge-info request + response parse (0xC6/0xC7 -> pictureWidth/Heigh)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*ReceiveCommandParse.java' | head -1)
          echo "@@@@@ badgeInfo parse @@@@@"
          [ -f "$f" ] && sed -n '/BadgeInfoReturn/,/return/p' "$f" | head -60
          echo "--- grep badge-info offsets ---"
          [ -f "$f" ] && grep -nE "BadgeInfoReturn|setPictureWidth|setPictureHeigh|setWidth|setHeight|setMemory|REP_BADGE|REQ_BADGE" "$f" | head -30
          c=$(find jadx-out/sources -path '*qix*BTCommandManager.java' | head -1)
          echo "--- badge-info request cmd ---"
          [ -f "$c" ] && grep -nE "BADGE_INFO|badgeInfo|BadgeInfo|REP_BADGE|REQ_BADGE" "$c" | head -10
          [ -f "$c" ] && sed -n '/badgeInfo/,/^    }/p' "$c" | head -20
      - name: How the badge picture size feeds the dial push (mo/ + Qix wrapper)
        run: |
          set +e
          grep -rnE "getPictureWidth|getPictureHeigh|BadgeInfoReturn|onReturnBadgeInfo|pictureWidth|pictureHeigh|getDialWide|getDialHigh" jadx-out/sources/mo jadx-out/sources/qn --include=*.java 2>/dev/null | head -30
          echo "--- IReceiveListener badge-info callback ---"
          l=$(find jadx-out/sources -path '*qix*IReceiveListener.java' | head -1)
          [ -f "$l" ] && grep -nE "Badge|Picture|badge|picture" "$l" | head -20
