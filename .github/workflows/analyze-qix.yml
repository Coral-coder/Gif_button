name: Analyze Qix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-qix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLnppanVuLnpydW5fMjAyNjA3MTQxNl9hYzY3NDIwMA?_p=Y29tLnppanVuLnpydW4%3D&download_id=1876509444531939&filename=ZRun_2.4.0_APKPure.xapk&full_size=89344935&is_hot=false&k=497d3ade37290e196b5c235b54770e3e6a641d28&package_name=com.zijun.zrun&source=web&token=1784773160-2328deaf1c-0-8c7826852cea2dd476bd414d75bc1ec5'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o z.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../z.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'zijun|zrun|base' | head -1 || ls xapk/*.apk | head -1)
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
      - name: Streaming orchestration — mo/c0.java + mo/p.java (full)
        run: |
          set +e
          for f in jadx-out/sources/mo/c0.java jadx-out/sources/mo/p.java; do
            echo "@@@@@ $f @@@@@"
            [ -f "$f" ] && cat "$f" || echo "(missing)"
            echo ""
          done
      - name: DialTool.sendDialFile + fileToBytes (the blob builder)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*DialTool.java' | head -1)
          echo "=== $f ==="
          [ -f "$f" ] && awk '/(sendDialFile|fileToBytes|sendVideoFile|getCRC16)/{p=1} p{print} /^    }$/{if(p)c++; if(c>0 && p){}}' "$f" | sed -n '1,200p'
          echo "=== full method bodies (sed) ==="
          [ -f "$f" ] && sed -n '/byte\[\] sendDialFile/,/^    }/p' "$f"
      - name: BTBluetoothManager — how the big byte[] is chunked to writes
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*BTBluetoothManager.java' | head -1)
          echo "=== $f ==="
          [ -f "$f" ] && grep -nE "void |int |public |private |static |MTU|mtu|20|write|Chunk|chunk|dial|Dial|sendData|sendCommand" "$f" | head -80
          echo "=== sendCommand_a2d + any file/dial sender bodies ==="
          for m in sendCommand_a2d sendDialData sendData writeData sendFileData sendCustomTheme pushDial; do
            [ -f "$f" ] && sed -n "/[^_]$m *(/,/^    }/p" "$f" | head -60
          done
      - name: CommandCode constants (PUSH_DIAL, PICTURE_SIZE, MEMORY, MARK)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*CommandCode.java' | head -1)
          echo "=== $f ==="
          [ -f "$f" ] && grep -nE "PUSH_DIAL|PICTURE|MEMORY|MARK|DIAL|THEME|PUSH|BOOT_ANI|SET_" "$f" | head -60
