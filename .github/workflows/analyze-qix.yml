name: Analyze Qix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-qix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLnppanVuLnpydW5fMjAyNjA3MTQxNl9hYzY3NDIwMA?_p=Y29tLnppanVuLnpydW4%3D&download_id=1876509444531939&filename=ZRun_2.4.0_APKPure.xapk&full_size=89344935&is_hot=false&k=497d3ade37290e196b5c235b54770e3e6a641d28&package_name=com.zijun.zrun&source=web&token=1784773160-2328deaf1c-0-8c7826852cea2dd476bd414d75bc1ec5'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o z.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../z.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'zijun|zrun|base' | head -1 || ls xapk/*.apk | head -1)
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
      - name: ImageCacheUtils — RGB565 byte order (bitmap2RGB / zoomBitmap)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*ImageCacheUtils.java' | head -1)
          echo "@@@@@ $f @@@@@"
          [ -f "$f" ] && sed -n '/bitmap2RGB/,/^    }/p' "$f"
          echo "--- any 565 / >> 8 / & 248 recoloring ---"
          [ -f "$f" ] && grep -nE "248|252|0xF8|0xFC|>> 3|<< 3|<< 8|565|RGB_565|shr|shl" "$f" | head -30
      - name: Picture-size response parse (COMMAND_REQ_PICTURE_SIZE = 0xDA)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*ReceiveCommandParse.java' | head -1)
          echo "@@@@@ $f @@@@@"
          [ -f "$f" ] && grep -nE "REQ_PICTURE_SIZE|PictureSize|pictureSize|onPictureSize|width|height|getWidth|getHeight" "$f" | head -30
          echo "--- parse body near picture size (opcode -38) ---"
          [ -f "$f" ] && sed -n '/case -38/,/break/p' "$f" | head -40
          echo "--- ReceiveCommandParse handler for -38 alt ---"
          [ -f "$f" ] && grep -n "38" "$f" | head -20
      - name: Where ThemeConfig / dial width+height come from
        run: |
          set +e
          for f in $(grep -rlniE "class ThemeConfig|ThemeConfig\(" jadx-out/sources --include=*.java 2>/dev/null | head -3); do
            echo "@@@@@ $f @@@@@"; grep -nE "width|height|Width|Height|512|360|240|466|454|patch|int " "$f" | head -30
          done
          echo "===== callers that set ThemeConfig width/height ====="
          grep -rnE "ThemeConfig|setWidth|setHeight|getPictureSize|PictureSize" jadx-out/sources/mo --include=*.java 2>/dev/null | head -30
      - name: PictureSize bean + listener callback
        run: |
          set +e
          for f in $(grep -rlniE "onResponsePictureSize|PictureSizeReturn|class PictureSize|pictureWidth|pictureHeight" jadx-out/sources/com/qix --include=*.java 2>/dev/null | sort -u | head -4); do
            echo "@@@@@ $f @@@@@"; sed -n '1,80p' "$f"
          done
