name: Analyze Qix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-qix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLnppanVuLnpydW5fMjAyNjA3MTQxNl9hYzY3NDIwMA?_p=Y29tLnppanVuLnpydW4%3D&download_id=1876509444531939&filename=ZRun_2.4.0_APKPure.xapk&full_size=89344935&is_hot=false&k=497d3ade37290e196b5c235b54770e3e6a641d28&package_name=com.zijun.zrun&source=web&token=1784773160-2328deaf1c-0-8c7826852cea2dd476bd414d75bc1ec5'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o z.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../z.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'zijun|zrun|base' | head -1 || ls xapk/*.apk | head -1)
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
      - name: UpdateManager — the dial-push orchestration (FULL)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*UpdateManager.java' | head -1)
          echo "@@@@@ $f @@@@@"
          [ -f "$f" ] && cat "$f" || echo "(UpdateManager missing)"
      - name: UpdateManager helpers — anything it delegates chunking to
        run: |
          set +e
          # classes in com/qix that reference PUSH_DIAL / file streaming / progress
          for f in $(grep -rlniE "COMMAND_SET_PUSH_DIAL|onResponseUpdateProgress|updateDial|sendDialData|writeDial|pushDial|SEND_FILE_TYPE|nextPacket|sendNextData" jadx-out/sources/com/qix --include=*.java 2>/dev/null | sort -u | head -6); do
            echo "@@@@@ $f @@@@@"; sed -n '1,260p' "$f"; echo ""
          done
      - name: mo/c0.java + mo/p.java — how blob is handed to UpdateManager
        run: |
          set +e
          for f in jadx-out/sources/mo/c0.java jadx-out/sources/mo/p.java; do
            echo "@@@@@ $f @@@@@"
            [ -f "$f" ] && grep -nE "DialTool|UpdateManager|setUpdateListener|startUpdate|pushDial|getWidth|getHeight|COMMAND_" "$f" | head -40
            echo "--- body around sendDialFile ---"
            [ -f "$f" ] && sed -n '/DialTool.sendDialFile/,+40p' "$f"
            echo ""
          done
      - name: A2DQueue + BLEBluetooth — command channel chunking (needSub subpackets)
        run: |
          set +e
          for n in A2DQueue BLEBluetooth; do
            f=$(find jadx-out/sources -path "*qix*$n.java" | head -1)
            echo "@@@@@ $f @@@@@"
            [ -f "$f" ] && grep -nE "void |public |private |20|write|MTU|mtu|subpackage|subPackage|chunk|split|WriteType|WITHOUT_RESPONSE|characteristic" "$f" | head -50
            echo "--- write/send bodies ---"
            for m in synchronizedCommand writeCharacteristic sendData write send subpackage; do
              [ -f "$f" ] && sed -n "/[^_A-Za-z]$m *(/,/^    }/p" "$f" | head -45
            done
          done
      - name: CommandCode constants (dump ALL)
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*CommandCode.java' | head -1)
          echo "=== $f ==="
          [ -f "$f" ] && grep -nE "COMMAND_" "$f" | head -140
