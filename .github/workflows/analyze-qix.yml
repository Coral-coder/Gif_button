name: Analyze Qix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-qix.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download + decompile
        run: |
          set +e
          URL='https://data.winudf.com/XAPK/Y29tLnppanVuLnpydW5fMjAyNjA3MTQxNl9hYzY3NDIwMA?_p=Y29tLnppanVuLnpydW4%3D&download_id=1876509444531939&filename=ZRun_2.4.0_APKPure.xapk&full_size=89344935&is_hot=false&k=497d3ade37290e196b5c235b54770e3e6a641d28&package_name=com.zijun.zrun&source=web&token=1784773160-2328deaf1c-0-8c7826852cea2dd476bd414d75bc1ec5'
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o z.xapk "$URL"
          mkdir -p xapk && (cd xapk && unzip -oq ../z.xapk)
          APK=$(ls xapk/*.apk | grep -iE 'zijun|zrun|base' | head -1 || ls xapk/*.apk | head -1)
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          mkdir -p jadx && (cd jadx && unzip -oq ../jadx.zip)
          ./jadx/bin/jadx --show-bad-code -d jadx-out --no-res "$APK" 2>/dev/null
      - name: intToBytes endianness
        run: |
          set +e
          f=$(find jadx-out/sources -path '*qix*TypeConversion.java' 2>/dev/null | head -1)
          [ -n "$f" ] && sed -n '/intToBytes/,/^    }/p' "$f" | head -30
      - name: Who streams the dial file (callers of DialTool.send*)
        run: |
          set +e
          echo "===== callers of DialTool.send* ====="
          grep -rn "DialTool\.\(send\|fileToBytes\|mapToBytes\)" jadx-out/sources --include=*.java 2>/dev/null | grep -viE "class DialTool" | head -30
          echo ""
          echo "===== dump the file-transfer method(s) (chunking the blob) ====="
          for f in $(grep -rlniE "DialTool\.send|sendDialData|updateDial|sendFileData|transferFile|CustomThemeData|writeFileData" jadx-out/sources/com/qix --include=*.java 2>/dev/null | sort -u | head -4); do
            echo "@@@@@ $f @@@@@"; sed -n '1,320p' "$f"
          done
